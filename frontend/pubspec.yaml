name: recycle_frontend
description: ReCycle — AI-powered used product marketplace (Flutter client).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  connectivity_plus: ^6.0.5
  tflite_flutter: ^0.11.0
  image: ^4.3.0
  crypto: ^3.0.6
  firebase_core: ^3.12.1
  cloud_firestore: ^5.6.9
  firebase_auth: ^5.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
